name: Vault
main: net.milkbowl.vault.Vault
load: STARTUP
version: 2.1.0
api-version: 1.13
description: Internal Economy provider like Vault 2.0 (no Vault.jar dependency)
softdepend: [LuckPerms, PlaceholderAPI, SkinsRestorer]
loadbefore: [MyCommand]
commands:
  balance:
    description: Show your current balance
    usage: /balance
    aliases: [bal, dinero]
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
    aliases: [pagar]
  vaultop:
    description: Show top players with the most money
    usage: /vaultop [page]
  vault:
    description: Vault menu and admin command
    usage: /vault [reload|update|loan|top|withdraw|history|offlinepay]
    aliases: [v, cofre, vault2]
    permission: vault.admin
  loan:
    description: Open the loan menu
    usage: /loan
    aliases: [prestamo]
  eco:
    description: Admin economy command (give/add/take/remove/set/reset/top)
    usage: /eco give|add|take|remove|set|reset <player> <amount> | /eco top [page]
    aliases: [economy, economia]
permissions:
  vault.balance:
    description: Allows using /balance
    default: true
  vault.pay:
    description: Allows using /pay menu and direct payments
    default: true
  vault.pay.bypass_min:
    description: Bypass minimum amount limit
    default: op
  vault.pay.bypass_max:
    description: Bypass maximum amount limit
    default: op
  vault.eco:
    description: Allow using /eco command
    default: op
    children:
      vault.eco.give: true
      vault.eco.take: true
      vault.eco.set: true
      vault.eco.reset: true
      vault.eco.top: true
  vault.eco.give:
    description: Allow using /eco give|add
    default: op
  vault.eco.take:
    description: Allow using /eco take|remove
    default: op
  vault.eco.set:
    description: Allow using /eco set
    default: op
  vault.eco.reset:
    description: Allow using /eco reset
    default: op
  vault.eco.top:
    description: Allow using /eco top and /vault top
    default: true
  vault.top:
    description: Allows using /vaultop
    default: true
  vault.loan:
    description: Allows using /vault loan
    default: true
  vault.withdraw:
    description: Allows using /vault withdraw (physical notes)
    default: true
  vault.redeem:
    description: Allows right-clicking physical notes to redeem them
    default: true
  vault.history:
    description: Allows using /vault history (transaction GUI)
    default: true
  vault.offlinepay.view:
    description: View the offline pay queue (/vault offlinepay list)
    default: op
  vault.offlinepay.refund:
    description: Refund an offline pay (/vault offlinepay refund <id>)
    default: op
  vault.admin:
    description: Allows using /vault (admin command)
    default: op

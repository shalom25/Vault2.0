name: Vault
main: net.milkbowl.vault.Vault
load: STARTUP
version: 2.1.2
api-version: 1.13
description: Internal Economy provider like Vault 2.0 (no Vault.jar dependency)
softdepend: [LuckPerms, PlaceholderAPI, SkinsRestorer]
loadbefore: [MyCommand]
commands:
  balance:
    description: Show your current balance
    usage: /balance
    aliases: [bal, dinero]
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
    aliases: [pagar]
  vaultop:
    description: Show top players with the most money
    usage: /vaultop [page]
  vault:
    description: Vault main command (menu, bank, notes, history, loans, top, admin)
    usage: /vault [reload|update|loan|top|withdraw|history|offlinepay|bank]
    aliases: [v, cofre, vault2]

  loan:
    description: Open the loan menu
    usage: /loan
    aliases: [prestamo]
  eco:
    description: Admin economy command (give/add/take/remove/set/reset/top)
    usage: /eco give|add|take|remove|set|reset <player> <amount> | /eco top [page]
    aliases: [economy, economia]
permissions:
  vault.balance:
    description: Allows using /balance
    default: true
  vault.pay:
    description: Allows using /pay menu and direct payments
    default: true
  vault.top:
    description: Allows viewing the top-richest players ranking via /vaultop, /eco top, and /vault top
    default: true
  vault.loan:
    description: Allows using the whole loan system (/loan or /vault loan: request, pay, status, menu)
    default: true
  vault.withdraw:
    description: Allows using /vault withdraw to create physical notes, AND right-clicking physical notes to redeem (cash) them
    default: true
  vault.history:
    description: Allows using /vault history (transaction GUI)
    default: true
  vault.use:
    description: Master "user" permission. Grants every NON-admin feature of the plugin (balance, pay, top ranking, loans, bank, physical notes, history, everything normal players need). Does NOT grant admin bypasses (pay min/max bypass, eco give/take/set/reset, offlinepay view/refund, reload/update/resetbalances). Those remain only for vault.admin / OP.
    default: true
    children:
      vault.balance: true
      vault.pay: true
      vault.top: true
      vault.loan: true
      vault.withdraw: true
      vault.history: true
      vault.bank: true
  vault.bank:
    description: Allows using the whole /vault bank section (balance / deposit / withdraw / top / menu / see other players)
    default: true
  vault.eco.admin:
    description: Allows ALL admin /eco subcommands (give/add, take/remove, set, reset, top). Single permission that covers the entire admin economy command.
    default: op
  vault.admin:
    description: Allows admin-only subcommands of /vault (reload, update, resetbalances, offlinepay). Also implicitly grants every vault.* permission.
    default: op
    children:
      vault.use: true
      vault.balance: true
      vault.pay: true
      vault.eco.admin: true
      vault.top: true
      vault.loan: true
      vault.withdraw: true
      vault.history: true
      vault.bank: true

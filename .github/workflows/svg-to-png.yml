name: Generate Logo PNG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  svg_to_png:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install librsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Convert SVG to PNG
        run: |
          mkdir -p assets
          # logo: ancho 2048x512 (formato banner)
          rsvg-convert -w 2048 -h 512 assets/logo.svg > assets/logo.png
          # cg-plugins: mantener tamaño existente (nombre real del archivo SVG)
          if [ -f assets/cg-plugins.svg ]; then
            rsvg-convert -w 1200 -h 628 assets/cg-plugins.svg > assets/cg-plugins.png
          fi
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Convert PNG to JPG
        run: |
          # generar JPG ancho desde el PNG
          convert assets/logo.png -background white -alpha remove -quality 92 assets/logo.jpg
          if [ -f assets/cg-plugins.png ]; then
            convert assets/cg-plugins.png -background white -alpha remove -quality 92 assets/cg-plugins.jpg
          fi
      - name: Commit PNG/JPG if changed
        run: |
          CHANGES=$(git status --porcelain)
          echo "$CHANGES"
          if echo "$CHANGES" | grep -E 'assets/(logo|cg-plugins)\.(png|jpg)'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/logo.png assets/logo.jpg
            git add assets/cg-plugins.png assets/cg-plugins.jpg 2>/dev/null || true
            git commit -m "CI: generar PNG/JPG desde SVG (logo y cg-plugins) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes in assets/*.png or assets/*.jpg"
          fi

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - profile: legacy
            java: '17'
            dir: target-java17
          - profile: modern
            java: '21'
            dir: target-java21
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK ${{ matrix.java }} (${{ matrix.profile }})"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: 'maven'
      - name: "Build with Maven -P${{ matrix.profile }}"
        run: mvn -B -P${{ matrix.profile }} -DskipTests package
      - name: Generate PNG logo from SVG
        if: matrix.profile == 'legacy'
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 256 assets/logo.svg -o assets/logo.png
      - name: Create GitHub Release
        if: matrix.profile == 'legacy'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target-java17/*.jar
            target-java21/*.jar
            assets/logo.png
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
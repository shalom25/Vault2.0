name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [ legacy, modern ]
        include:
          - profile: legacy
            java: '17'
            dir: target-java17
          - profile: modern
            java: '21'
            dir: target-java21
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK ${{ matrix.java }} (${{ matrix.profile }})"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: 'maven'
      - name: "Build with Maven -P${{ matrix.profile }}"
        run: mvn -B -P${{ matrix.profile }} -DskipTests package
      - name: "Upload artifact (${{ matrix.profile }})"
        uses: actions/upload-artifact@v4
        with:
          name: vault-jar-${{ matrix.profile }}
          path: ${{ matrix.dir }}/*.jar